name: Deploy TEI to VM

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modded-tei-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Validate live server and bind mounts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "yquestmastery@$DEPLOY_HOST" 'python3 -' <<'PY'
          import json, os, subprocess, sys
          container = "bar-devtools-teiserver-1"
          base = os.path.realpath(os.path.expanduser("~/BAR-Devtools/teiserver"))
          inspect = json.loads(subprocess.check_output(["podman", "inspect", container], text=True))[0]
          if not inspect["State"]["Running"]:
              sys.exit("Refusing deployment: container is not running")
          mounts = {m["Destination"]: os.path.realpath(m["Source"]) for m in inspect["Mounts"]}
          for directory in ("lib", "assets"):
              expected = os.path.join(base, directory)
              if mounts.get("/app/" + directory) != expected or not os.path.isdir(expected):
                  sys.exit("Refusing deployment: unexpected " + directory + " bind mount")
          marker = subprocess.run(["podman", "exec", container, "test", "-f", "/app/.devtools/.initialized"])
          if marker.returncode:
              sys.exit("Refusing deployment: first-run database marker missing")
          print("Live mounts and database safeguard verified")
          PY
      - name: Transfer runtime code only
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          tar --exclude='*.env' --exclude='*.secret.exs' \
              --exclude='lib/teiserver/account/account_import.ex' \
              --exclude='assets/node_modules' \
              -cf - lib assets | \
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "yquestmastery@$DEPLOY_HOST" \
              'tar -xf - -C "$HOME/BAR-Devtools/teiserver" --no-same-owner --no-same-permissions'
      - name: Restart existing TEI container
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "yquestmastery@$DEPLOY_HOST" \
            'podman restart bar-devtools-teiserver-1 >/dev/null &&
             test "$(podman inspect --format "{{.State.Running}}" bar-devtools-teiserver-1)" = true'
